<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Calculator & Unit Converter - Fast, modern, responsive calculation and unit conversion web application.">
  <title>SmartCalc & Unit Converter</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
  <div class="app-background-glow glow-1"></div>
  <div class="app-background-glow glow-2"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="16" y1="14" x2="16" y2="18"></line>
            <path d="M16 10h.01"></path>
            <path d="M12 10h.01"></path>
            <path d="M8 10h.01"></path>
            <path d="M12 14h.01"></path>
            <path d="M8 14h.01"></path>
            <path d="M12 18h.01"></path>
            <path d="M8 18h.01"></path>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">SmartCalc</h1>
          <span class="brand-subtitle">Calculator & Unit Converter</span>
        </div>
      </div>

      <div class="header-actions">
        <!-- Sound Toggle -->
        <button id="soundToggleBtn" class="icon-btn" title="Toggle Sound Feedback" aria-label="Toggle sound feedback">
          <svg class="sound-on-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg class="sound-off-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme" aria-label="Toggle theme">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- History Drawer Toggle -->
        <button id="historyToggleBtn" class="icon-btn" title="Calculation History" aria-label="View history">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="historyBadge" class="history-badge hidden">0</span>
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs" role="tablist">
      <button class="tab-button active" data-tab="calculator" role="tab" aria-selected="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="2"></rect>
          <line x1="8" y1="6" x2="16" y2="6"></line>
          <line x1="16" y1="14" x2="16" y2="18"></line>
          <path d="M16 10h.01"></path>
          <path d="M12 10h.01"></path>
          <path d="M8 10h.01"></path>
          <path d="M12 14h.01"></path>
          <path d="M8 14h.01"></path>
          <path d="M12 18h.01"></path>
          <path d="M8 18h.01"></path>
        </svg>
        Calculator
      </button>
      <button class="tab-button" data-tab="converter" role="tab" aria-selected="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"></polyline>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <polyline points="7 23 3 19 7 15"></polyline>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
        Unit Converter
      </button>
    </nav>

    <!-- TAB 1: CALCULATOR -->
    <main id="calculatorView" class="view-panel active">
      <div class="calculator-card">
        <!-- Display Screen -->
        <div class="calc-display" id="calcDisplay">
          <div class="calc-expression" id="calcExpression" title="Current Expression"></div>
          <div class="calc-main-row">
            <span class="calc-value" id="calcMainValue">0</span>
            <button class="copy-value-btn" id="copyResultBtn" title="Copy result to clipboard" aria-label="Copy result">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
          <div class="calc-preview" id="calcPreview"></div>
        </div>

        <!-- Mode bar: Deg/Rad & Scientific toggle -->
        <div class="calc-mode-bar">
          <div class="mode-toggles-left">
            <button class="mode-chip active" id="angleModeBtn" data-mode="DEG" title="Toggle Degrees/Radians">DEG</button>
            <span class="memory-indicator hidden" id="memoryIndicator">M</span>
          </div>
          <div class="mode-toggles-right">
            <button class="mode-chip" id="scientificToggleBtn" title="Toggle Scientific Keypad">
              <span class="sci-label">Scientific</span>
              <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <!-- Memory Buttons Row -->
        <div class="memory-row">
          <button class="key-btn key-memory" data-action="mc" title="Memory Clear">MC</button>
          <button class="key-btn key-memory" data-action="mr" title="Memory Recall">MR</button>
          <button class="key-btn key-memory" data-action="m-plus" title="Memory Add">M+</button>
          <button class="key-btn key-memory" data-action="m-minus" title="Memory Subtract">M−</button>
          <button class="key-btn key-memory" data-action="ms" title="Memory Store">MS</button>
        </div>

        <!-- Scientific Function Pad (Collapsible) -->
        <div class="scientific-pad collapsed" id="scientificPad">
          <button class="key-btn key-fn" data-fn="sin" title="Sine">sin</button>
          <button class="key-btn key-fn" data-fn="cos" title="Cosine">cos</button>
          <button class="key-btn key-fn" data-fn="tan" title="Tangent">tan</button>
          <button class="key-btn key-fn" data-fn="log" title="Logarithm base 10">log</button>
          <button class="key-btn key-fn" data-fn="ln" title="Natural Logarithm">ln</button>

          <button class="key-btn key-fn" data-fn="sqrt" title="Square Root">√</button>
          <button class="key-btn key-fn" data-op="^" title="Power">xʸ</button>
          <button class="key-btn key-fn" data-fn="square" title="Square">x²</button>
          <button class="key-btn key-fn" data-fn="fact" title="Factorial">n!</button>
          <button class="key-btn key-fn" data-fn="inv" title="Reciprocal">1/x</button>

          <button class="key-btn key-fn" data-const="pi" title="Pi (3.14159...)">π</button>
          <button class="key-btn key-fn" data-const="e" title="Euler's Constant (2.71828...)">e</button>
          <button class="key-btn key-fn" data-insert="(" title="Left Parenthesis">(</button>
          <button class="key-btn key-fn" data-insert=")" title="Right Parenthesis">)</button>
          <button class="key-btn key-fn" data-fn="abs" title="Absolute Value">|x|</button>
        </div>

        <!-- Main Standard Keypad Grid -->
        <div class="keypad-grid">
          <!-- Row 1 -->
          <button class="key-btn key-action" data-action="clear" title="Clear all (Escape)">AC</button>
          <button class="key-btn key-action" data-action="delete" title="Backspace (Delete)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>
          <button class="key-btn key-op" data-op="%" title="Percentage">%</button>
          <button class="key-btn key-op" data-op="÷" title="Divide (/)">÷</button>

          <!-- Row 2 -->
          <button class="key-btn key-num" data-num="7">7</button>
          <button class="key-btn key-num" data-num="8">8</button>
          <button class="key-btn key-num" data-num="9">9</button>
          <button class="key-btn key-op" data-op="×" title="Multiply (*)">×</button>

          <!-- Row 3 -->
          <button class="key-btn key-num" data-num="4">4</button>
          <button class="key-btn key-num" data-num="5">5</button>
          <button class="key-btn key-num" data-num="6">6</button>
          <button class="key-btn key-op" data-op="−" title="Subtract (-)">−</button>

          <!-- Row 4 -->
          <button class="key-btn key-num" data-num="1">1</button>
          <button class="key-btn key-num" data-num="2">2</button>
          <button class="key-btn key-num" data-num="3">3</button>
          <button class="key-btn key-op" data-op="+" title="Add (+)">+</button>

          <!-- Row 5 -->
          <button class="key-btn key-num" data-action="negate" title="Negate (±)">±</button>
          <button class="key-btn key-num" data-num="0">0</button>
          <button class="key-btn key-num" data-action="decimal" title="Decimal point">.</button>
          <button class="key-btn key-equals" data-action="equals" title="Calculate (Enter)">=</button>
        </div>
      </div>
    </main>

    <!-- TAB 2: UNIT CONVERTER -->
    <main id="converterView" class="view-panel">
      <div class="converter-card">
        <!-- Category Selector Pills -->
        <div class="category-scroll-container">
          <div class="category-pills" id="categoryPills">
            <button class="category-pill active" data-category="length">
              <span class="cat-icon">📏</span> Length
            </button>
            <button class="category-pill" data-category="mass">
              <span class="cat-icon">⚖️</span> Mass & Weight
            </button>
            <button class="category-pill" data-category="temperature">
              <span class="cat-icon">🌡️</span> Temperature
            </button>
            <button class="category-pill" data-category="digital">
              <span class="cat-icon">💾</span> Digital Data
            </button>
            <button class="category-pill" data-category="speed">
              <span class="cat-icon">🚀</span> Speed
            </button>
            <button class="category-pill" data-category="time">
              <span class="cat-icon">⏱️</span> Time
            </button>
            <button class="category-pill" data-category="area">
              <span class="cat-icon">📐</span> Area
            </button>
            <button class="category-pill" data-category="volume">
              <span class="cat-icon">🧪</span> Volume
            </button>
          </div>
        </div>

        <!-- Two-Way Conversion Interactive Area -->
        <div class="converter-boxes">
          <!-- Source Unit Box -->
          <div class="converter-box" id="fromBox">
            <label class="converter-label" for="fromValueInput">From</label>
            <div class="input-wrapper">
              <input type="number" id="fromValueInput" class="converter-input" value="1" step="any" placeholder="0">
              <button class="clear-input-btn" id="clearFromInput" title="Clear input">×</button>
            </div>
            <div class="select-wrapper">
              <select id="fromUnitSelect" class="unit-select"></select>
            </div>
          </div>

          <!-- Swap Button -->
          <button class="swap-units-btn" id="swapUnitsBtn" title="Swap units (⇄)" aria-label="Swap units">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 16V4M7 4L3 8M7 4L11 8"></path>
              <path d="M17 8V20M17 20L21 16M17 20L13 16"></path>
            </svg>
          </button>

          <!-- Target Unit Box -->
          <div class="converter-box" id="toBox">
            <div class="box-header-row">
              <label class="converter-label" for="toValueInput">To</label>
              <button class="copy-converter-btn" id="copyConvertedBtn" title="Copy converted result" aria-label="Copy result">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy</span>
              </button>
            </div>
            <div class="input-wrapper">
              <input type="number" id="toValueInput" class="converter-input" value="" step="any" placeholder="0">
            </div>
            <div class="select-wrapper">
              <select id="toUnitSelect" class="unit-select"></select>
            </div>
          </div>
        </div>

        <!-- Formula and Quick Info Card -->
        <div class="formula-card" id="formulaCard">
          <div class="formula-header">
            <span class="formula-title-icon">💡</span>
            <span class="formula-title">Conversion Formula</span>
          </div>
          <div class="formula-details" id="formulaText">1 m = 3.28084 ft</div>
        </div>

        <!-- Quick Reference Chips -->
        <div class="quick-reference-section">
          <h3 class="section-title">Common Milestones</h3>
          <div class="quick-reference-grid" id="quickRefGrid">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
    </main>

    <!-- Calculation History Drawer Overlay -->
    <div class="history-backdrop" id="historyBackdrop"></div>
    <aside class="history-drawer" id="historyDrawer" aria-hidden="true">
      <div class="history-header">
        <div class="history-title-group">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <h2>History</h2>
        </div>
        <button id="closeHistoryBtn" class="icon-btn" aria-label="Close history">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="history-list" id="historyList">
        <div class="history-empty">
          <div class="empty-icon">📝</div>
          <p>No calculations yet</p>
          <span>Calculations you perform will appear here for quick reuse.</span>
        </div>
      </div>

      <div class="history-footer">
        <button id="clearHistoryBtn" class="clear-history-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Clear History
        </button>
      </div>
    </aside>

    <!-- Toast Notification Popup -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- Keyboard Shortcuts Helper Footer -->
    <footer class="app-footer">
      <div class="keyboard-hints">
        <span class="hint-badge"><kbd>Enter</kbd> =</span>
        <span class="hint-badge"><kbd>Esc</kbd> Clear</span>
        <span class="hint-badge"><kbd>⌫</kbd> Delete</span>
        <span class="hint-badge"><kbd>Tab</kbd> Switch Tab</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
